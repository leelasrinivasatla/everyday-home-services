<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Geometric Modern Roof & Shield Shape -->
  <g transform="translate(256, 256)">
    <!-- Roof Path -->
    <path d="M -130,-10 L 0,-130 L 130,-10 L 90,20 L 0,-60 L -90,20 Z" fill="url(#accentGrad)" />
    
    <!-- Shield / Core Base -->
    <path d="M -80,50 L 0,130 L 80,50 L 80,-30 L -80,-30 Z" fill="#ffffff" fill-opacity="0.9" />

    <!-- Center Precision Verified Check -->
    <path d="M -35,50 L -10,75 L 38,25" fill="none" stroke="#059669" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
